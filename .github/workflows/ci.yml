name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Test, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          # Tests must run offline — no real API keys required.
          # GeminiModelProvider defaults to DeterministicMockProvider when key is absent.
          GEMINI_API_KEY: ""
          NEATLOGS_API_KEY: ""
          CLOSEPILOT_USE_LIVE_LLM: "false"

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
